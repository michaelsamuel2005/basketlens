[project]
name = "basketlens"
version = "0.1.0"
description = "Supplier analytics on loyalty-card data: shopper decomposition, journeys, segments, promotions, ranging, campaigns, with a simulated twin and answer key"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "pyarrow>=14", "duckdb>=1.0", "statsmodels>=0.14", "scikit-learn>=1.3",
                "scipy>=1.10", "pyreadr>=0.5", "python-pptx>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
basketlens = "basketlens.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
basketlens = ["sql/*.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["slow: runs the full twin scorecard (about two minutes)"]
